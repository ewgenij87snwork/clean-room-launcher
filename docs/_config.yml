title: Clean Room Launcher (CLROOM)
description: Clean/selective Codex and Claude Code launches on macOS with project context preserved and unrelated personal-global instructions and unselected personal-global skills left out per launch.
url: "https://y-sor.github.io"
baseurl: "/clean-room-launcher"
repository: y-sor/clean-room-launcher
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-relative-links

kramdown:
  parse_block_html: true

relative_links:
  enabled: true
  collections: false

header_pages:
  - why-clroom.md
  - problem-index.md
  - use-cases.md
  - agent-runners.md
  - skill-sets.md
  - when-to-use-clroom.md
  - claude-code.md
  - codex.md
  - faq.md
