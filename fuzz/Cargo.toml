[package]
name = "clean-room-launcher-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"

[dependencies.clroom]
package = "clean-room-launcher"
path = ".."

[workspace]
members = ["."]

[[bin]]
name = "schema_validate"
path = "fuzz_targets/schema_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_framing"
path = "fuzz_targets/manifest_framing.rs"
test = false
doc = false
bench = false
