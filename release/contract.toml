schema_version = 1
required_changelog_sections = ["Added", "Compatibility", "Security"]
required_pre_tag_evidence = [
  "full_tests",
  "public_boundary",
  "release_readiness",
  "artifact_verification",
  "dependency_sca"
]
required_post_tag_evidence = [
  "draft_artifact_checksums",
  "draft_artifact_provenance",
  "draft_artifact_sbom",
  "draft_install_smoke"
]

[change_classes.runtime]
patterns = ["src/**"]
pre_tag_evidence = ["focused_tests", "full_tests"]

[change_classes.security_boundary]
patterns = [
  "src/adapters/**",
  "src/catalog/**",
  "src/cli/**",
  "install.sh",
  "scripts/release/**",
  "packaging/**",
  ".github/workflows/**"
]
pre_tag_evidence = ["security_negative_tests", "full_tests"]

[change_classes.tests]
patterns = ["tests/**", "fixtures/**", "fuzz/**"]
pre_tag_evidence = ["full_tests"]

[change_classes.dependency]
patterns = ["Cargo.toml", "Cargo.lock", "deny.toml"]
pre_tag_evidence = ["dependency_review", "dependency_sca"]

[change_classes.ci]
patterns = [".github/workflows/**"]
pre_tag_evidence = ["ci"]

[change_classes.release_pipeline]
patterns = [".github/workflows/release*.yml", "scripts/release/**"]
pre_tag_evidence = ["release_readiness", "artifact_verification"]

[change_classes.packaging]
patterns = ["packaging/**", "install.sh"]
pre_tag_evidence = ["artifact_verification", "installer_self_test"]

[change_classes.public_claims]
patterns = ["README.md", "SECURITY.md", "CHANGELOG.md", "docs/**"]
pre_tag_evidence = ["claim_review", "public_boundary"]

[change_classes.package_identity]
patterns = ["Cargo.toml", "Cargo.lock", "packaging/targets.toml"]
pre_tag_evidence = ["version_identity"]

[capabilities.claude_plugin_activation]
pre_tag_evidence = [
  "claude_2_1_273_inventory_e2e",
  "claude_2_1_273_selected_load_e2e",
  "interactive_tui_smoke",
  "surface_fail_closed_negatives"
]
post_tag_evidence = [
  "draft_artifact_claude_2_1_273_e2e"
]
