name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  target-matrix:
    name: Validate packaging target matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate declared matrix
        run: |
          test -s packaging/targets.toml
          advertised=$(sed -n 's/^advertised_targets = \[\(.*\)\]/\1/p' packaging/targets.toml)
          qualified=$(sed -n 's/^qualified_targets = \[\(.*\)\]/\1/p' packaging/targets.toml)
          test "$advertised" = "$qualified"
      - name: Validate qualified target metadata
        run: |
          qualified=$(sed -n 's/^qualified_targets = \[\(.*\)\]/\1/p' packaging/targets.toml | tr -d '"' | tr ',' ' ')
          for target_name in $qualified; do
            entry=$(grep -A8 "name = \"$target_name\"" packaging/targets.toml)
            printf '%s\n' "$entry" | grep -q 'qualification_status = "QUALIFIED"'
            printf '%s\n' "$entry" | grep -q 'rust_target = "[^"]\+"'
            printf '%s\n' "$entry" | grep -q 'runner = "[^"]\+"'
          done
      - name: Run target-matrix fixtures
        run: |
          CARGO_MANIFEST_DIR="$PWD" rustc --test tests/packaging/target_matrix.rs -o /tmp/taskseal-target-matrix
          /tmp/taskseal-target-matrix

  docs-discovery:
    name: Validate docs discovery assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sitemap and robots contract
        run: |
          test -s docs/sitemap.xml
          grep -Fq 'permalink: /sitemap.xml' docs/sitemap.xml
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' docs/sitemap.xml
          grep -Fq 'Sitemap: https://ewgenij87snwork.github.io/clean-room-launcher/sitemap.xml' docs/robots.txt
          grep -Fq 'url: "https://ewgenij87snwork.github.io"' docs/_config.yml
          grep -Fq 'baseurl: "/clean-room-launcher"' docs/_config.yml
          ! grep -Eq '^[[:space:]]*-[[:space:]]+jekyll-sitemap[[:space:]]*$' docs/_config.yml

  qualified-target-lanes:
    name: Build qualified target lane
    needs: target-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpha-macos-aarch64
            runner: macos-14
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --all-targets --target "${{ matrix.rust_target }}"
