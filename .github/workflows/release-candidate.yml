name: Release candidate verification

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  # Closed required gate list: p02-gate p03-gate p04-gate p05-gate p06-gate p07-gate.
  # The single orchestrator records every result against TASKSEAL_SUBJECT_DIGEST.
  release-candidate:
    name: Verify release candidate (no-skip)
    runs-on: ubuntu-latest
    env:
      TASKSEAL_SUBJECT_DIGEST: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release candidate (P02-P07 and source checks)
        run: scripts/release-build/verify-source.sh --subject-digest "$TASKSEAL_SUBJECT_DIGEST"
